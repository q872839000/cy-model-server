# 应用级配置（可被环境变量 UMS_HOST/UMS_PORT/UMS_LOG_LEVEL/UMS_LOG_FORMAT 覆盖）
app:
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  log_format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  # 生产环境配置
  workers: 1  # 模型服务建议单worker，避免内存重复加载
  max_request_size: 10485760  # 10MB
  request_timeout: 300  # 5分钟

# 全局推理引擎默认设置（模型未指定时使用）
engine_defaults:
  llm_engine: transformers           # 可选: transformers | vllm
  embedding_engine: transformers
  reranker_engine: transformers
  device: cuda                       # 默认设备
  dtype: float32                     # 默认精度（可选: float16 | bfloat16 | null表示全精度）

# LLM 模型列表
# - name: 必须唯一，用于 API 调用时指定模型
# - path: 本地模型路径
# - chat_strategy: 对话模板策略（qwen|glm|deepseek|generic）
# - engine/device/dtype: 可选，未指定时使用 engine_defaults
# - gen_params: 生成参数默认值
llms:
  - name: Qwen2-0___5B-Instruct
    path: E:\\Ai\\models\\Qwen\\Qwen2-0___5B-Instruct
    chat_strategy: qwen
    gen_params:
      max_tokens: 512
      temperature: 0.7
      top_p: 0.95

# Embedding 模型列表
embeddings:
  - name: bge-large-zh
    path: E:\\Ai\\models\\BAAI\\bge-large-zh

# Reranker 模型列表
rerankers:
  - name: bge-reranker-base
    path: E:\\Ai\\models\\BAAI\\bge-reranker-base