# 应用级配置（可被环境变量 UMS_HOST/UMS_PORT/UMS_LOG_LEVEL/UMS_LOG_FORMAT 覆盖）
app:
  host: 0.0.0.0
  port: 8000
  log_level: DEBUG
  log_format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  # AsyncWorker 线程池大小：控制同时执行的推理任务数
  # 不配置（注释掉）时自动计算：sum(max_concurrent × replicas) + embedding/reranker 数量
  # 手动配置时直接使用指定值，建议 >= 所有模型 max_concurrent 之和
  # workers: 32

# 全局推理引擎默认设置（模型未指定时使用）
engine_defaults:
  llm_engine: transformers           # 可选: transformers | vllm
  embedding_engine: transformers
  reranker_engine: transformers
  device: cuda                       # 默认设备
  dtype: float16                     # 默认精度（可选: float16 | bfloat16 | null表示全精度）

# LLM 模型列表
# - name: 必须唯一，用于 API 调用时指定模型
# - path: 本地模型路径
# - chat_strategy: 对话模板策略，支持细粒度配置：
#     通用: generic
#     Qwen系列: qwen (基础) | qwen2 | qwen3 (支持深度思考)
#     GLM系列: glm (基础) | glm4 (GLM-4系列, 可选思考) | glm4-z1 (GLM-Z1系列, 强制思考)
#     Deepseek系列: deepseek (基础) | deepseek-r1 (支持深度思考)
#     Phi-4系列: phi4 (14B基础) | phi4-mini (3.8B) | phi4-reasoning (14B推理) | phi4-mini-reasoning (3.8B推理)
# - engine/device/dtype: 可选，未指定时使用 engine_defaults
# - context_window: 模型上下文窗口大小（token 数）。未配置时自动从模型 config 探测。
#     服务会根据 context_window 和每次请求的 prompt_tokens 动态计算 max_tokens，
#     既不压制模型能力，也不会超出上下文限制。
# - gen_params.max_tokens: 硬件级输出上限（防 OOM）。动态预算结果不会超过此值。
#     根据显存大小配置，例如 8GB 显存跑 1.7B 模型建议 2048~4096。
# - gen_params: 其他生成参数默认值（temperature, top_p, top_k 等）
#
# 部署与并发配置（所有字段均有默认值，现有配置无需修改）：
# - replicas: 副本数量（默认 1）。每个副本持有独立引擎实例，可绑定不同 GPU
# - devices: 各副本绑定的设备列表，如 ['cuda:0', 'cuda:1']。未配置时所有副本使用 device 字段
# - max_concurrent: 每副本最大并发推理数。transformers 建议 1；vLLM 可设为更大值启用连续批处理
# - max_queue_size: 每个部署最大排队请求数（默认 64），超出时返回 503
# - tensor_parallel_size: 张量并行度（仅 vLLM），大于 1 时模型切分到多张 GPU
# - request_timeout: 单次推理最大等待时间（秒，默认 300）
# - cancel_grace_period: 取消后宽限时间（秒，默认 5）
llms:
  - name: Qwen3-1___7B
    path: E:\\Ai\\models\\Qwen\\Qwen3-1___7B
    chat_strategy: qwen3           # 使用 Qwen3 策略，支持 enable_thinking 参数
    enable_thinking: false
    # context_window: 40960      # 可选：手动指定上下文窗口（未配置时自动探测）
    max_concurrent: 32
    engine: vllm
    gen_params:
      max_tokens: 2048            # 硬件级上限：8GB 显存的安全输出长度，防止 OOM
#      temperature: 0.7
#      top_p: 0.95

#  多副本 vLLM 部署示例（需要多张 GPU 和 vLLM 安装）：
