<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库对话测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a5f7a 0%, #159895 100%);
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .main-panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            color: #495057;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .config-section {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 500;
            color: #495057;
            margin-bottom: 5px;
            font-size: 13px;
        }

        input, textarea, select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d1d3e2;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #159895;
            box-shadow: 0 0 0 3px rgba(21, 152, 149, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .inline-group {
            display: flex;
            gap: 10px;
        }

        .inline-group .form-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }

        button {
            background: linear-gradient(135deg, #1a5f7a 0%, #159895 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(21, 152, 149, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        /* 聊天区域 */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 15px;
            min-height: 400px;
            max-height: calc(100vh - 280px);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message-user {
            align-items: flex-end;
        }

        .message-assistant {
            align-items: flex-start;
        }

        .message-role {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 4px;
        }

        .message-content {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-user .message-content {
            background: linear-gradient(135deg, #1a5f7a 0%, #159895 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-assistant .message-content {
            background: white;
            color: #212529;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        .streaming-cursor::after {
            content: '▋';
            animation: blink 1s infinite;
            color: #159895;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .think-block {
            background: #e8f5f4;
            border-left: 3px solid #159895;
            padding: 10px 15px;
            margin: 8px 0;
            font-style: italic;
            color: #6c757d;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
        }

        .think-block::before {
            content: '💭 思考中...';
            display: block;
            font-weight: 600;
            color: #159895;
            margin-bottom: 5px;
            font-style: normal;
        }

        /* 知识库信息面板 */
        .kb-info-panel {
            background: #e8f5f4;
            border: 1px solid #b2dfdb;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            font-size: 13px;
        }

        .kb-info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .kb-info-title {
            font-weight: 600;
            color: #00695c;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .kb-info-toggle {
            color: #00695c;
            font-size: 12px;
        }

        .kb-info-content {
            display: none;
        }

        .kb-info-content.expanded {
            display: block;
        }

        .kb-info-row {
            display: flex;
            margin-bottom: 6px;
        }

        .kb-info-label {
            color: #00695c;
            font-weight: 500;
            min-width: 80px;
        }

        .kb-info-value {
            color: #004d40;
        }

        /* 引用来源 */
        .sources-list {
            margin-top: 10px;
        }

        .source-item {
            background: white;
            border: 1px solid #b2dfdb;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .source-index {
            background: #159895;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .source-doc {
            font-weight: 500;
            color: #00695c;
            font-size: 13px;
        }

        .source-chapter {
            color: #6c757d;
            font-size: 12px;
        }

        .source-score {
            background: #e0f2f1;
            color: #00695c;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
        }

        .source-preview {
            font-size: 12px;
            color: #495057;
            line-height: 1.5;
            max-height: 60px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            min-height: 50px;
            max-height: 120px;
        }

        .input-area button {
            width: auto;
            padding: 12px 24px;
        }

        /* 状态提示 */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #fff3cd;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #856404;
        }

        .status-bar.success {
            background: #d4edda;
            color: #155724;
        }

        .status-bar.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-bar.hidden {
            display: none;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #856404;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 元数据 */
        .metadata {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #6c757d;
            padding-top: 10px;
            border-top: 1px solid #e9ecef;
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧配置面板 -->
        <div class="sidebar">
            <h1>📚 知识库对话测试</h1>

            <div class="config-section">
                <h2>🔧 基础配置</h2>
                <div class="form-group">
                    <label for="baseUrl">API 地址</label>
                    <input type="text" id="baseUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
                </div>

                <div class="form-group">
                    <label for="modelName">模型名称（留空自动获取）</label>
                    <input type="text" id="modelName" placeholder="例如：glm-4-9b">
                </div>

                <div class="form-group">
                    <label for="collectionName">知识库名称</label>
                    <input type="text" id="collectionName" value="test_knowledge_base" placeholder="Milvus Collection 名称">
                </div>
            </div>

            <div class="config-section">
                <h2>🔍 检索配置</h2>
                <div class="inline-group">
                    <div class="form-group">
                        <label for="searchMode">检索模式</label>
                        <select id="searchMode">
                            <option value="hybrid" selected>混合检索</option>
                            <option value="dense">语义检索</option>
                            <option value="sparse">关键词检索</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="searchTopK">检索数量</label>
                        <input type="number" id="searchTopK" value="5" min="1" max="20">
                    </div>
                </div>

                <div class="inline-group">
                    <div class="form-group">
                        <label for="queryRewrite">Query改写</label>
                        <select id="queryRewrite">
                            <option value="auto" selected>自动</option>
                            <option value="always">始终改写</option>
                            <option value="never">不改写</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="scoreThreshold">分数阈值</label>
                        <input type="number" id="scoreThreshold" value="0.3" min="0" max="1" step="0.1">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="searchEnabled" checked>
                    <label for="searchEnabled">启用检索</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rerank" checked>
                    <label for="rerank">启用重排序</label>
                </div>
            </div>

            <div class="config-section">
                <h2>⚙️ 生成配置</h2>
                <div class="inline-group">
                    <div class="form-group">
                        <label for="maxTokens">Max Tokens</label>
                        <input type="number" id="maxTokens" value="1024" min="1" max="8192">
                    </div>
                    <div class="form-group">
                        <label for="temperature">Temperature</label>
                        <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="enableThinking" checked>
                    <label for="enableThinking">启用深度思考</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="returnSources" checked>
                    <label for="returnSources">返回引用来源</label>
                </div>
            </div>

            <button id="clearBtn" class="btn-secondary" onclick="clearChat()">🗑️ 清空对话</button>
        </div>

        <!-- 右侧聊天面板 -->
        <div class="main-panel">
            <div class="chat-header">
                <h2 style="border: none; margin: 0; padding: 0;">💬 对话窗口</h2>
                <div class="metadata" id="metadata" style="display: none; border: none; padding: 0;">
                    <div class="metadata-item">
                        <span>⏱</span> 耗时: <span id="elapsedTime">0</span>ms
                    </div>
                    <div class="metadata-item">
                        <span>🔍</span> 检索: <span id="searchTime">0</span>ms
                    </div>
                </div>
            </div>

            <div id="statusBar" class="status-bar hidden">
                <div class="spinner"></div>
                <span id="statusText">处理中...</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message message-assistant">
                    <div class="message-role">助手</div>
                    <div class="message-content">
                        👋 你好！我是知识库助手。请输入你的问题，我会基于知识库为你提供答案。
                        <br><br>
                        📖 当前知识库包含：
                        <br>• Nginx配置指南
                        <br>• 公司规章制度
                    </div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="userInput" placeholder="输入你的问题..." onkeydown="handleKeyDown(event)"></textarea>
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 对话历史
        let chatHistory = [];
        let isStreaming = false;
        let startTime = 0;

        // 发送消息
        async function sendMessage() {
            if (isStreaming) return;

            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            if (!message) return;

            // 添加用户消息到界面
            appendMessage('user', message);
            chatHistory.push({ role: 'user', content: message });
            userInput.value = '';

            // 获取配置
            const config = getConfig();

            // 显示状态
            showStatus('正在处理...', 'pending');
            isStreaming = true;
            startTime = Date.now();
            document.getElementById('sendBtn').disabled = true;

            try {
                // 自动获取模型
                if (!config.model) {
                    showStatus('获取模型列表...', 'pending');
                    config.model = await getFirstLLMModel(config.baseUrl);
                    document.getElementById('modelName').value = config.model;
                }

                // 发送请求
                showStatus('检索知识库...', 'pending');
                const response = await fetch(`${config.baseUrl}/v1/kb/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: config.model,
                        collection_name: config.collectionName,
                        messages: chatHistory,
                        stream: true,
                        search_enabled: config.searchEnabled,
                        search_mode: config.searchMode,
                        search_top_k: config.searchTopK,
                        rerank: config.rerank,
                        score_threshold: config.scoreThreshold,
                        query_rewrite: config.queryRewrite,
                        max_tokens: config.maxTokens,
                        temperature: config.temperature,
                        enable_thinking: config.enableThinking,
                        return_sources: config.returnSources,
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                // 处理流式响应
                showStatus('生成回答中...', 'pending');
                await handleStreamResponse(response, config.returnSources);

                // 更新元数据
                const elapsed = Date.now() - startTime;
                document.getElementById('elapsedTime').textContent = elapsed;
                document.getElementById('metadata').style.display = 'flex';
                showStatus('完成', 'success');

            } catch (error) {
                console.error('请求错误:', error);
                showStatus(`错误: ${error.message}`, 'error');
                appendMessage('assistant', `❌ 请求失败: ${error.message}`);
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        // 处理流式响应
        async function handleStreamResponse(response, returnSources) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            let assistantContent = '';
            let kbInfo = null;
            let messageElement = null;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n');

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;

                    const dataStr = line.slice(6);
                    if (dataStr === '[DONE]') {
                        // 完成，移除光标
                        if (messageElement) {
                            messageElement.classList.remove('streaming-cursor');
                        }
                        continue;
                    }

                    try {
                        const data = JSON.parse(dataStr);

                        // 获取 kb_info
                        if (data.kb_info && !kbInfo) {
                            kbInfo = data.kb_info;
                            if (kbInfo.search_took_ms) {
                                document.getElementById('searchTime').textContent = 
                                    Math.round(kbInfo.search_took_ms);
                            }
                        }

                        // 获取内容
                        const delta = data.choices?.[0]?.delta || {};
                        const content = delta.content || '';

                        if (content) {
                            if (!messageElement) {
                                // 创建消息元素
                                messageElement = appendMessage('assistant', '', true);
                            }
                            assistantContent += content;
                            // 格式化 <think> 标签
                            const formattedContent = formatThinkBlocks(assistantContent);
                            messageElement.innerHTML = formattedContent;
                        }

                    } catch (e) {
                        console.warn('解析 JSON 失败:', dataStr);
                    }
                }
            }

            // 添加到历史
            if (assistantContent) {
                chatHistory.push({ role: 'assistant', content: assistantContent });
            }

            // 输出完整响应到控制台，方便调试
            console.log('=== KB Chat 完整响应 ===');
            console.log('助手回复:', assistantContent);
            console.log('知识库信息:', JSON.stringify(kbInfo, null, 2));

            // 显示知识库信息（仅在有 kbInfo 时显示）
            if (kbInfo && returnSources) {
                appendKBInfo(kbInfo);
            }
        }

        // 添加消息到界面
        function appendMessage(role, content, streaming = false) {
            const chatMessages = document.getElementById('chatMessages');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${role}`;

            const roleLabel = document.createElement('div');
            roleLabel.className = 'message-role';
            roleLabel.textContent = role === 'user' ? '用户' : '助手';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (streaming) {
                contentDiv.classList.add('streaming-cursor');
            }
            contentDiv.textContent = content;

            messageDiv.appendChild(roleLabel);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return contentDiv;
        }

        // 添加知识库信息面板
        function appendKBInfo(kbInfo) {
            const chatMessages = document.getElementById('chatMessages');
            const lastMessage = chatMessages.lastElementChild;

            const panel = document.createElement('div');
            panel.className = 'kb-info-panel';

            const header = document.createElement('div');
            header.className = 'kb-info-header';
            header.onclick = () => {
                const content = panel.querySelector('.kb-info-content');
                content.classList.toggle('expanded');
                toggle.textContent = content.classList.contains('expanded') ? '收起 ▲' : '展开 ▼';
            };

            const title = document.createElement('div');
            title.className = 'kb-info-title';
            title.innerHTML = `📋 知识库信息`;

            const toggle = document.createElement('div');
            toggle.className = 'kb-info-toggle';
            toggle.textContent = '展开 ▼';

            header.appendChild(title);
            header.appendChild(toggle);

            const content = document.createElement('div');
            content.className = 'kb-info-content';

            // 基本信息
            content.innerHTML = `
                <div class="kb-info-row">
                    <span class="kb-info-label">意图识别:</span>
                    <span class="kb-info-value">${kbInfo.intent || 'N/A'}</span>
                </div>
                <div class="kb-info-row">
                    <span class="kb-info-label">是否检索:</span>
                    <span class="kb-info-value">${kbInfo.search_performed ? '是' : '否'}</span>
                </div>
                <div class="kb-info-row">
                    <span class="kb-info-label">检索Query:</span>
                    <span class="kb-info-value">${kbInfo.search_query || 'N/A'}</span>
                </div>
                <div class="kb-info-row">
                    <span class="kb-info-label">是否改写:</span>
                    <span class="kb-info-value">${kbInfo.query_rewritten ? '是' : '否'}</span>
                </div>
                ${kbInfo.original_query ? `
                <div class="kb-info-row">
                    <span class="kb-info-label">原始问题:</span>
                    <span class="kb-info-value">${kbInfo.original_query}</span>
                </div>
                ` : ''}
            `;

            // 引用来源
            if (kbInfo.sources && kbInfo.sources.length > 0) {
                const sourcesList = document.createElement('div');
                sourcesList.className = 'sources-list';
                sourcesList.innerHTML = '<div style="font-weight: 600; color: #00695c; margin-bottom: 8px;">📖 引用来源</div>';

                kbInfo.sources.forEach(source => {
                    const sourceItem = document.createElement('div');
                    sourceItem.className = 'source-item';
                    sourceItem.innerHTML = `
                        <div class="source-header">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="source-index">${source.index}</span>
                                <span class="source-doc">${source.doc_name}</span>
                                <span class="source-chapter">${source.chapter}</span>
                            </div>
                            <span class="source-score">相关度: ${(source.score * 100).toFixed(1)}%</span>
                        </div>
                        <div class="source-preview">${source.content_preview}</div>
                    `;
                    sourcesList.appendChild(sourceItem);
                });

                content.appendChild(sourcesList);
            }

            panel.appendChild(header);
            panel.appendChild(content);
            lastMessage.appendChild(panel);

            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 获取配置
        function getConfig() {
            return {
                baseUrl: document.getElementById('baseUrl').value.trim(),
                model: document.getElementById('modelName').value.trim(),
                collectionName: document.getElementById('collectionName').value.trim(),
                searchEnabled: document.getElementById('searchEnabled').checked,
                searchMode: document.getElementById('searchMode').value,
                searchTopK: parseInt(document.getElementById('searchTopK').value),
                rerank: document.getElementById('rerank').checked,
                scoreThreshold: parseFloat(document.getElementById('scoreThreshold').value),
                queryRewrite: document.getElementById('queryRewrite').value,
                maxTokens: parseInt(document.getElementById('maxTokens').value),
                temperature: parseFloat(document.getElementById('temperature').value),
                enableThinking: document.getElementById('enableThinking').checked,
                returnSources: document.getElementById('returnSources').checked,
            };
        }

        // 获取第一个 LLM 模型
        async function getFirstLLMModel(baseUrl) {
            const resp = await fetch(`${baseUrl}/v1/models`);
            if (!resp.ok) throw new Error(`获取模型失败: ${resp.status}`);

            const data = await resp.json();
            const models = data.data || [];

            const llmModel = models.find(m => {
                const mid = m.id.toLowerCase();
                return !['bge', 'embed', 'rerank'].some(kw => mid.includes(kw));
            });

            if (!llmModel) throw new Error('未找到可用的 LLM 模型');
            return llmModel.id;
        }

        // 格式化思考块
        function formatThinkBlocks(content) {
            return content
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/&lt;think&gt;/g, '<div class="think-block">')
                .replace(/&lt;\/think&gt;/g, '</div>');
        }

        // 显示状态
        function showStatus(text, type) {
            const statusBar = document.getElementById('statusBar');
            const statusText = document.getElementById('statusText');
            
            statusBar.classList.remove('hidden', 'success', 'error');
            if (type === 'success') {
                statusBar.classList.add('success');
                setTimeout(() => statusBar.classList.add('hidden'), 2000);
            } else if (type === 'error') {
                statusBar.classList.add('error');
            }
            
            statusText.textContent = text;
        }

        // 清空对话
        function clearChat() {
            chatHistory = [];
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `
                <div class="message message-assistant">
                    <div class="message-role">助手</div>
                    <div class="message-content">
                        👋 对话已清空。请输入你的问题，我会基于知识库为你提供答案。
                    </div>
                </div>
            `;
            document.getElementById('metadata').style.display = 'none';
            document.getElementById('statusBar').classList.add('hidden');
        }

        // 处理回车发送
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
