<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天补全测试工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }

        .sidebar {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .main-panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2 {
            color: #495057;
            font-size: 16px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .config-section {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: 500;
            color: #495057;
            margin-bottom: 5px;
            font-size: 13px;
        }

        input, textarea, select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #d1d3e2;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .inline-group {
            display: flex;
            gap: 10px;
        }

        .inline-group .form-group {
            flex: 1;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #6c757d;
            margin-top: 10px;
        }

        /* 聊天区域 */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 15px;
            min-height: 400px;
            max-height: calc(100vh - 280px);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message-user {
            align-items: flex-end;
        }

        .message-assistant {
            align-items: flex-start;
        }

        .message-role {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 4px;
        }

        .message-content {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-assistant .message-content {
            background: white;
            color: #212529;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        .think-block {
            background: #f0f0f0;
            border-left: 3px solid #667eea;
            padding: 10px 15px;
            margin: 8px 0;
            font-style: italic;
            color: #6c757d;
            font-size: 13px;
            border-radius: 0 8px 8px 0;
        }

        .think-block::before {
            content: '💭 思考中...';
            display: block;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
            font-style: normal;
        }

        .streaming-cy::after {
            content: '▋';
            animation: blink 1s infinite;
            color: #667eea;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 状态提示 */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #fff3cd;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 13px;
            color: #856404;
        }

        .status-bar.success {
            background: #d4edda;
            color: #155724;
        }

        .status-bar.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-bar.hidden {
            display: none;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #856404;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 输入区域 */
        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            min-height: 50px;
            max-height: 120px;
        }

        .input-area button {
            width: auto;
            padding: 12px 24px;
        }

        /* 元数据 */
        .metadata {
            display: flex;
            gap: 20px;
            font-size: 12px;
            color: #6c757d;
            padding-top: 10px;
            border-top: 1px solid #e9ecef;
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧配置面板 -->
        <div class="sidebar">
            <h1>🚀 聊天补全测试</h1>

            <div class="config-section">
                <h2>🔧 基础配置</h2>
                <div class="form-group">
                    <label for="baseUrl">API 地址</label>
                    <input type="text" id="baseUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
                </div>

                <div class="form-group">
                    <label for="modelName">模型名称（留空自动获取）</label>
                    <input type="text" id="modelName" placeholder="例如：llama-2-7b-chat">
                </div>

                <div class="form-group">
                    <label for="systemPrompt">系统提示词</label>
                    <textarea id="systemPrompt">你是一个有帮助的助手。</textarea>
                </div>
            </div>

            <div class="config-section">
                <h2>⚙️ 生成配置</h2>
                <div class="inline-group">
                    <div class="form-group">
                        <label for="maxTokens">Max Tokens</label>
                        <input type="number" id="maxTokens" value="4096" min="1" max="8192">
                    </div>

                    <div class="form-group">
                        <label for="temperature">Temperature</label>
                        <input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1">
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="streamMode" checked>
                    <label for="streamMode">流式输出</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="enableThinking" checked>
                    <label for="enableThinking">启用深度思考</label>
                </div>
            </div>

            <button id="clearBtn" class="btn-secondary" onclick="clearChat()">🗑️ 清空对话</button>
        </div>

        <!-- 右侧聊天面板 -->
        <div class="main-panel">
            <div class="chat-header">
                <h2 style="border: none; margin: 0; padding: 0;">💬 对话窗口</h2>
                <div class="metadata" id="metadata" style="display: none; border: none; padding: 0;">
                    <div class="metadata-item">
                        <span>⏱</span> 耗时: <span id="elapsedTime">0</span>ms
                    </div>
                    <div class="metadata-item">
                        <span>📊</span> Tokens: <span id="tokenCount">0</span>
                    </div>
                </div>
            </div>

            <div id="statusBar" class="status-bar hidden">
                <div class="spinner"></div>
                <span id="statusText">处理中...</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message message-assistant">
                    <div class="message-role">助手</div>
                    <div class="message-content">
                        👋 你好！我是AI助手。请输入你的问题，我会尽力为你解答。
                        <br><br>
                        💡 提示：
                        <br>• 支持多轮对话，保留历史上下文
                        <br>• 启用深度思考可看到模型推理过程
                    </div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="userInput" placeholder="输入你的问题..." onkeydown="handleKeyDown(event)"></textarea>
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        // 对话历史
        let chatHistory = [];
        let isStreaming = false;
        let tokenCount = 0;
        let startTime = 0;

        // 发送消息
        async function sendMessage() {
            if (isStreaming) return;

            const userInput = document.getElementById('userInput');
            const message = userInput.value.trim();
            if (!message) return;

            // 添加用户消息到界面
            appendMessage('user', message);
            chatHistory.push({ role: 'user', content: message });
            userInput.value = '';

            // 获取配置
            const config = getConfig();

            // 显示状态
            showStatus('正在处理...', 'pending');
            isStreaming = true;
            tokenCount = 0;
            startTime = Date.now();
            document.getElementById('sendBtn').disabled = true;

            try {
                // 自动获取模型
                if (!config.model) {
                    showStatus('获取模型列表...', 'pending');
                    config.model = await getFirstLLMModel(config.baseUrl);
                    document.getElementById('modelName').value = config.model;
                }

                // 构建消息列表（包含 system prompt）
                const messages = [
                    { role: 'system', content: config.systemPrompt },
                    ...chatHistory
                ];

                // 发送请求
                showStatus('生成回答中...', 'pending');
                const response = await fetch(`${config.baseUrl}/v1/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: config.model,
                        messages: messages,
                        stream: config.stream,
                        max_tokens: config.maxTokens,
                        temperature: config.temperature,
                        enable_thinking: config.enableThinking,
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }

                // 处理响应
                let assistantContent = '';
                if (config.stream) {
                    assistantContent = await handleStreamResponse(response);
                } else {
                    assistantContent = await handleNonStreamResponse(response);
                }

                // 添加到历史
                if (assistantContent) {
                    chatHistory.push({ role: 'assistant', content: assistantContent });
                }

                // 更新元数据
                const elapsed = Date.now() - startTime;
                document.getElementById('elapsedTime').textContent = elapsed;
                document.getElementById('tokenCount').textContent = tokenCount;
                document.getElementById('metadata').style.display = 'flex';
                showStatus('完成', 'success');

                // 输出完整响应到控制台
                console.log('=== Chat Completion 完整响应 ===');
                console.log('助手回复:', assistantContent);

            } catch (error) {
                console.error('请求错误:', error);
                showStatus(`错误: ${error.message}`, 'error');
                appendMessage('assistant', `❌ 请求失败: ${error.message}`);
            } finally {
                isStreaming = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }

        // 处理流式响应
        async function handleStreamResponse(response) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let assistantContent = '';
            let reasoningContent = '';
            let messageElement = null;
            let thinkBlockEl = null;
            let contentEl = null;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();

                for (const line of lines) {
                    const trimmedLine = line.trim();
                    if (!trimmedLine.startsWith('data: ')) continue;

                    const dataStr = trimmedLine.slice(6);
                    if (dataStr === '[DONE]') {
                        if (messageElement) {
                            messageElement.classList.remove('streaming-cy');
                        }
                        continue;
                    }

                    try {
                        const data = JSON.parse(dataStr);
                        const delta = data.choices?.[0]?.delta || {};
                        const reasoning = delta.reasoning_content || '';
                        const content = delta.content || '';

                        // 首次收到内容时创建消息容器
                        if ((reasoning || content) && !messageElement) {
                            messageElement = appendMessage('assistant', '', true);
                            messageElement.innerHTML = '';
                        }

                        // 思考内容 → think-block 区域
                        if (reasoning) {
                            if (!thinkBlockEl) {
                                thinkBlockEl = document.createElement('div');
                                thinkBlockEl.className = 'think-block';
                                messageElement.appendChild(thinkBlockEl);
                            }
                            reasoningContent += reasoning;
                            thinkBlockEl.textContent = reasoningContent;
                            tokenCount++;
                        }

                        // 正文内容 → content 区域
                        if (content) {
                            if (!contentEl) {
                                contentEl = document.createElement('div');
                                messageElement.appendChild(contentEl);
                            }
                            assistantContent += content;
                            contentEl.textContent = assistantContent;
                            tokenCount++;
                        }
                    } catch (e) {
                        console.warn('解析 JSON 失败:', dataStr);
                    }
                }
            }

            if (messageElement) {
                messageElement.classList.remove('streaming-cy');
            }

            return assistantContent;
        }

        // 处理非流式响应
        async function handleNonStreamResponse(response) {
            const data = await response.json();
            const message = data.choices?.[0]?.message || {};
            const content = message.content || '';
            const reasoning = message.reasoning_content || '';

            tokenCount = content.length;

            const messageElement = appendMessage('assistant', '', false);
            messageElement.innerHTML = '';

            // 有思考内容时展示 think-block
            if (reasoning) {
                const thinkBlock = document.createElement('div');
                thinkBlock.className = 'think-block';
                thinkBlock.textContent = reasoning;
                messageElement.appendChild(thinkBlock);
            }

            // 正文内容
            if (content) {
                const contentDiv = document.createElement('div');
                contentDiv.textContent = content;
                messageElement.appendChild(contentDiv);
            }

            console.log('完整响应数据:', JSON.stringify(data, null, 2));

            return content;
        }


        // 添加消息到界面
        function appendMessage(role, content, streaming = false) {
            const chatMessages = document.getElementById('chatMessages');

            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${role}`;

            const roleLabel = document.createElement('div');
            roleLabel.className = 'message-role';
            roleLabel.textContent = role === 'user' ? '用户' : '助手';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (streaming) {
                contentDiv.classList.add('streaming-cy');
            }
            contentDiv.textContent = content;

            messageDiv.appendChild(roleLabel);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return contentDiv;
        }

        // 获取配置
        function getConfig() {
            return {
                baseUrl: document.getElementById('baseUrl').value.trim(),
                model: document.getElementById('modelName').value.trim(),
                systemPrompt: document.getElementById('systemPrompt').value.trim(),
                maxTokens: parseInt(document.getElementById('maxTokens').value),
                temperature: parseFloat(document.getElementById('temperature').value),
                stream: document.getElementById('streamMode').checked,
                enableThinking: document.getElementById('enableThinking').checked,
            };
        }

        // 获取第一个 LLM 模型
        async function getFirstLLMModel(baseUrl) {
            const resp = await fetch(`${baseUrl}/v1/models`);
            if (!resp.ok) throw new Error(`获取模型失败: ${resp.status}`);

            const data = await resp.json();
            const models = data.data || [];

            const llmModel = models.find(m => {
                const mid = m.id.toLowerCase();
                return !['bge', 'embed', 'rerank'].some(kw => mid.includes(kw));
            });

            if (!llmModel) throw new Error('未找到可用的 LLM 模型');
            return llmModel.id;
        }

        // 显示状态
        function showStatus(text, type) {
            const statusBar = document.getElementById('statusBar');
            const statusText = document.getElementById('statusText');

            statusBar.classList.remove('hidden', 'success', 'error');
            if (type === 'success') {
                statusBar.classList.add('success');
                setTimeout(() => statusBar.classList.add('hidden'), 2000);
            } else if (type === 'error') {
                statusBar.classList.add('error');
            }

            statusText.textContent = text;
        }

        // 清空对话
        function clearChat() {
            chatHistory = [];
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = `
                <div class="message message-assistant">
                    <div class="message-role">助手</div>
                    <div class="message-content">
                        👋 对话已清空。请输入你的问题，我会尽力为你解答。
                    </div>
                </div>
            `;
            document.getElementById('metadata').style.display = 'none';
            document.getElementById('statusBar').classList.add('hidden');
        }

        // 处理回车发送
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
